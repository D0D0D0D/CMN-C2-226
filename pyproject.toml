[project]
name = "cmn-c2-226"
version = "1.0.0"
description = "Agent Output Hallucination & Quality Anomaly Detection Agent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# supplied by the platform's own package registry at build time. Pinning it here
# would make `pip install -e .` fail because it is not resolvable from the
# default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff.lint.per-file-ignores]
# 上流 scaffold 由来の既知違反のみを該当ファイル限定で抑止する。
# 配布された PB テストなので本体を書き換えず byte-identity を維持する
# （再同期で差分を出さないため）。配布元にも同じ F541 が存在する。
# conftest / src/graph/__init__.py は sys.path 調整や循環回避のため module-level
# import が先頭に来ない（E402）。構造上の要請なので当該ファイル限定で抑止する。
"tests/proof_of_boundary/test_import_isolation.py" = ["F541"]
"tests/proof_of_boundary/test_state_safety.py" = ["F541"]
